<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Image Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    background: #333;
    overflow: hidden;
  }
  #og-container {
    width: 1200px;
    height: 630px;
    background-color: #0A0A0A;
    position: absolute;
    top: 0;
    left: 0;
    box-sizing: border-box;
    padding: 40px;
    transform-origin: top left;
  }
  .card {
    width: 100%;
    height: 100%;
    border: 1px solid #27272A;
    border-radius: 24px;
    position: relative;
    padding: 60px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: #A1A1AA;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: 100%;
    white-space: nowrap;
  }
  .main-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 80px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.1;
    letter-spacing: -0.03em;
    max-width: 900px;
  }
  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: #FFFFFF;
  }
  .footer-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #A1A1AA;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div id="og-container">
  <div class="card">
    <div class="header">
      <span>MAYOWA KALEJAIYE</span>
      <span>SOFTWARE &amp; AI SYSTEMS ENGINEER</span>
    </div>
    
    <div class="main-text">
      I engineer scalable<br/>
      backend systems and<br/>
      intelligent infrastructure.
    </div>

    <div class="footer">
      <div>
        <div class="footer-meta">mayowa-kalejaiye.vercel.app</div>
        <div class="footer-text">Mayowa Kalejaiye | Software Engineer</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  window.onload = () => {
    // Force scale so mobile screens don't mess up DPR
    setTimeout(() => {
      html2canvas(document.querySelector("#og-container"), { 
        scale: 1,
        width: 1200,
        height: 630,
        windowWidth: 1200,
        windowHeight: 630
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'og-image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }, 1500); // Wait for fonts to load
  };
</script>

</body>
</html>
